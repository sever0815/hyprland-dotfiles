config_version = 20

[audio]
enable_sounds = false

[bar]
order = [ "default" ]

    [bar.default]
    concave_edge_corners = false
    end = [
        "tray",
        "notifications",
        "clipboard",
        "keyboard_layout",
        "network",
        "bluetooth",
        "volume",
        "input_volume",
        "brightness",
        "battery",
        "current",
        "control-center",
        "session"
    ]
    margin_ends = "0%"
    radius = 0
    shadow = false
    start = [ "launcher", "wallpaper", "workspaces", "media" ]
    widget_spacing = 15

[battery]
warning_threshold = 20

[brightness]
enable_ddcutil = true

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[lockscreen]
transition = []

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 208.0
    box_width = 368.0
    cx = 960.0
    cy = 420.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 208.0
    box_width = 368.0
    cx = 960.0
    cy = 420.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

[notification]
follow_focused_output = true
max_visible = 3
scale = 0.9000000059604645

[osd.kinds]
bluetooth = false
brightness = false
caffeine = false
custom = false
dnd = false
keyboard_backlight = false
keyboard_layout = false
lock_keys = false
media = false
media_volume = false
nightlight = false
power_profile = false
privacy = false
volume = false
wifi = false

[plugins]
enabled = [ "noctalia/timer", "noctalia/translator", "yugaaank/better-clock", "thaer99ob/default-apps" ]

[shell]
corner_radius_scale = 0.0

    [shell.launcher]
    layout = "simple"
    pinned = [
        "throne",
        "app.fluxer.FluxerDesktop",
        "equibop",
        "io.github.forkgram.tdesktop",
        "obsidian",
        "org.strawberrymusicplayer.strawberry"
    ]

    [shell.screen_corners]
    size = 1

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    glyph = "hibernate"
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "primary"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl hibernate"
    countdown_seconds = 0.0
    enabled = true
    glyph = "brightness"
    label = "Hibernate"
    shortcut = "4"
    variant = "secondary"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "6"
    variant = "destructive"

[system.monitor]
cpu_poll_seconds = 0
disk_poll_seconds = 0
gpu_poll_seconds = 0
memory_poll_seconds = 0
network_poll_seconds = 0

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "foot", "gtk3", "gtk4", "helix", "hyprland", "kcolorscheme", "kitty", "qt" ]
    community_ids = [
        "pywalfox",
        "discord",
        "gimp",
        "lazyvim",
        "libreoffice",
        "micro",
        "neovim",
        "obsidian",
        "zed",
        "prismlauncher",
        "obs",
        "thunderbird",
        "hyprtoolkit",
        "papirus-icons",
        "thunar"
    ]

[wallpaper]
directory = "/home/sever/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/sever/Pictures/wallpapers/nature.jpg"

    [wallpaper.last]
    path = "/home/sever/Pictures/wallpapers/nature.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/sever/Pictures/wallpapers/nature.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/sever/Pictures/wallpapers/nature.jpg"

[widget.brightness]
show_when_unavailable = true

[widget.current]
type = "thaer99ob/default-apps:current"

[widget.media]
hide_when_no_media = true
show_progress = true

[widget.network]
peek = true
show_label = false